<div class="shell">
  <ul class="band">
    <li *ngFor="let tile of band; let i = index" [hairitReveal]="i * 120">
      <span class="band__tile" [class]="'band__tile--' + tile.variant">
        <ng-container *ngIf="tile.word; else bandIcon">{{ tile.word }}</ng-container>
        <ng-template #bandIcon><hairit-icon [name]="tile.icon!" /></ng-template>
      </span>
    </li>
  </ul>

  <div class="studio">
    <div class="studio__media" hairitReveal>
      <img src="images/editorial-portrait.jpg" alt="Portret editorial realizat în salonul HairIT" loading="lazy" />
      <img class="studio__media-inset" src="images/studio-interior.jpg" alt="Interiorul salonului" loading="lazy" />
      <span class="studio__badge">
        <hairit-icon name="spark" />
        Din 2014
      </span>
    </div>

    <div class="studio__copy">
      <p class="eyebrow" hairitReveal>Salonul</p>

      <h2 class="studio__statement" hairitReveal="80">
        Suntem un salon independent care lucrează cu programări limitate pe zi,
        <span>ca fiecare client să primească timpul, atenția și rezultatul pentru care a venit.</span>
      </h2>

      <div class="studio__footer" hairitReveal="160">
        <div class="studio__facts">
          <p><hairit-icon name="map-pin" /> Str. Dorobanți 42, București</p>
          <p><hairit-icon name="clock" /> Luni–Sâmbătă, 09:00 – 19:30</p>
          <p><hairit-icon name="phone" /> +40 21 555 0142</p>
        </div>

        <button type="button" class="pill pill--dark pill--arrow pill--up" (click)="ui.openModal()">
          Cere o programare
          <span class="pill__badge"><hairit-icon name="arrow-up-right" /></span>
        </button>
      </div>
    </div>
  </div>
</div>
