<hairit-liquid-reveal
  class="hero__media"
  base="images/hero-primary.jpg"
  reveal="images/hero-reveal.jpg"
  alt="Interiorul salonului HairIT"
/>

<div class="hero__vignette" aria-hidden="true"></div>
<p class="hero__watermark watermark" aria-hidden="true">HAIRIT</p>

<div class="hero__grid shell">
  <div class="hero__intro">
    <p class="eyebrow hero__eyebrow">Salon independent · București</p>

    <h1 class="hero__title">
      <span class="hero__line" *ngFor="let line of headline; let i = index" [style.--line-delay.ms]="250 + i * 120">
        <span>{{ line }}</span>
      </span>
    </h1>

    <div class="hero__rating">
      <span class="hero__stars">
        <hairit-icon name="star" *ngFor="let star of stars" />
      </span>
      <span>4.9 din 5 · peste 2.400 de programări onorate</span>
    </div>

    <div class="hero__actions">
      <button type="button" class="pill pill--dark pill--arrow" (click)="go('programari')">
        Rezervă un interval
        <span class="pill__badge"><hairit-icon name="arrow-right" /></span>
      </button>
      <button type="button" class="pill pill--outline" (click)="go('servicii')">Vezi serviciile</button>
    </div>
  </div>

  <div class="hero__aside">
    <article class="hero__card" (click)="move(1)">
      <div class="hero__card-tile">
        <hairit-icon name="scissors" />
      </div>
      <div class="hero__card-body">
        <div class="hero__card-slot">
          <p class="hero__card-caption">{{ card().caption }}</p>
          <p class="hero__card-title">{{ card().title }}</p>
        </div>
        <div class="hero__card-controls">
          <span class="hero__dots">
            <i *ngFor="let item of cards; let i = index" [class.is-active]="i === activeCard()"></i>
          </span>
          <span class="hero__arrows">
            <button type="button" class="hero__arrow" (click)="move(-1); $event.stopPropagation()" aria-label="Anterior">
              <hairit-icon name="arrow-right" class="is-flipped" />
            </button>
            <button type="button" class="hero__arrow" (click)="move(1); $event.stopPropagation()" aria-label="Următor">
              <hairit-icon name="arrow-right" />
            </button>
          </span>
        </div>
      </div>
    </article>

    <div class="hero__partners">
      <p class="hero__partners-label">Lucrăm cu</p>
      <ul>
        <li *ngFor="let partner of partners">
          <hairit-icon name="circle-dot" />
          {{ partner }}
        </li>
      </ul>
    </div>
  </div>
</div>

<div class="hero__status shell">
  <span>Deschis din 2014</span>
  <span class="hero__status-mid" *ngIf="freeToday() > 0">{{ freeToday() }} intervale libere astăzi</span>
  <span class="hero__status-end">
    Derulează
    <hairit-icon name="arrow-down" />
  </span>
</div>
