<div class="menu__bar shell">
  <p class="menu__brand">
    <hairit-icon name="spark" class="menu__spark" />
    HairIT
  </p>
  <button type="button" class="menu__close" (click)="ui.closeMenu()">
    <hairit-icon name="close" />
    <span>Închide</span>
  </button>
</div>

<nav class="menu__nav shell" aria-label="Meniu principal">
  <ul>
    <li *ngFor="let link of links; let i = index" [style.--stagger.ms]="i * 45 + 80">
      <button type="button" (click)="ui.goTo(link.target)">
        <span class="menu__index">{{ index(i) }}</span>
        <span class="menu__label">{{ link.label }}</span>
      </button>
    </li>
  </ul>
</nav>

<div class="menu__footer shell">
  <span>Ora locală — {{ clock.time() }}</span>
  <button type="button" class="menu__cta" (click)="ui.openModal()">
    Cere o programare
    <hairit-icon name="arrow-right" />
  </button>
</div>
