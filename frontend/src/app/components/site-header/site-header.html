<div class="header__inner shell">
  <button type="button" class="header__brand" (click)="go('acasa')">
    <hairit-icon name="spark" class="header__spark" />
    <span>HairIT</span>
  </button>

  <nav class="header__nav" aria-label="Navigare principală">
    <ul>
      <li *ngFor="let link of links">
        <button type="button" (click)="go(link.target)">{{ link.label }}</button>
      </li>
    </ul>
  </nav>

  <div class="header__actions">
    <div class="header__clock" aria-hidden="true">
      <span class="header__clock-label">Ora locală</span>
      <span class="header__clock-time">{{ clock.time() }}</span>
      <span class="header__clock-dot">•</span>
      <span class="header__clock-date">{{ clock.date() }}</span>
    </div>

    <button type="button" class="header__menu" (click)="ui.openMenu()">
      <hairit-icon name="menu" />
      <span class="header__menu-label">Meniu</span>
    </button>
  </div>
</div>
