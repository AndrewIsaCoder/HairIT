<button
  type="button"
  class="term"
  [ngClass]="{
    'term--available': isAvailable(),
    'term--booked': !isAvailable(),
    'is-selected': selected()
  }"
  (click)="choose.emit(term())"
  [attr.aria-pressed]="selected()"
>
  <span class="term__time">{{ term().time }}</span>

  <span class="term__body">
    <span class="term__service">{{ term().service }}</span>
    <span class="term__meta">{{ term().stylist }} · {{ term().durationMin }} min · {{ price() }}</span>
  </span>

  <span class="term__status">{{ isAvailable() ? 'Liber' : 'Ocupat' }}</span>
</button>
