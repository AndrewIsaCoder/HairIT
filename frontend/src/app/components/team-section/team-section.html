<div class="shell">
  <header class="team__head" hairitReveal>
    <p class="eyebrow eyebrow--boxed">Echipa</p>
    <h2 class="display team__title">Oameni care<br />lucrează cu răbdare</h2>
  </header>

  <ul class="team__grid">
    <li *ngFor="let stylist of store.stylists(); let i = index" [hairitReveal]="i * 90">
      <article class="member">
        <header class="member__top">
          <span class="member__role">{{ stylist.role }}</span>
          <span class="member__badge"><hairit-icon name="arrow-up-right" /></span>
        </header>

        <span class="member__initials" aria-hidden="true">{{ stylist.initials }}</span>

        <div class="member__bottom">
          <h3 class="member__name">{{ stylist.name }}</h3>
          <p class="member__years">{{ profile(i).years }}</p>
          <ul class="member__tags">
            <li class="tag tag--light" *ngFor="let tag of profile(i).tags">{{ tag }}</li>
          </ul>
          <button type="button" class="member__cta" (click)="ui.goTo('programari')">
            Vezi intervalele
            <hairit-icon name="arrow-right" />
          </button>
        </div>
      </article>
    </li>
  </ul>
</div>
