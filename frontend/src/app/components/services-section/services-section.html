<div class="shell">
  <div class="services__head">
    <div hairitReveal>
      <p class="eyebrow">Servicii</p>
      <h2 class="display services__title">Ce facem<br />cel mai bine</h2>
    </div>

    <div class="services__intro" hairitReveal="120">
      <p class="lead">
        Fiecare serviciu începe cu o consultație scurtă și se termină cu un rezultat pe care îl poți
        reproduce acasă. Prețurile includ produsele profesionale folosite în salon.
      </p>
      <button type="button" class="pill pill--outline pill--arrow" (click)="ui.goTo('programari')">
        Vezi intervalele libere
        <span class="pill__badge"><hairit-icon name="arrow-up-right" /></span>
      </button>
    </div>
  </div>

  <ul class="services__list">
    <li *ngFor="let service of store.services(); let i = index" [hairitReveal]="i * 80">
      <button type="button" class="service" (click)="ui.goTo('programari')">
        <span class="service__index">{{ index(i) }}</span>

        <span class="service__main">
          <span class="service__name">{{ service.name }}</span>
          <span class="service__category">{{ service.category }}</span>
        </span>

        <span class="service__description">{{ service.description }}</span>

        <span class="service__meta">
          <span class="service__duration"><hairit-icon name="clock" /> {{ service.durationMin }} min</span>
          <span class="service__price">{{ price(service.price) }}</span>
        </span>

        <span class="service__badge"><hairit-icon name="arrow-up-right" /></span>
      </button>
    </li>
  </ul>

  <p class="services__empty" *ngIf="store.services().length === 0">
    Serviciile se încarcă din API. Pornește serverul cu <code>npm run dev</code> în folderul backend.
  </p>
</div>
