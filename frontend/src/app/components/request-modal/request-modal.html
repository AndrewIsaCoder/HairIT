<div class="modal__backdrop" (click)="close()"></div>

<div class="modal__panel" role="dialog" aria-modal="true" aria-label="Cere o programare">
  <button type="button" class="modal__close" (click)="close()" aria-label="Închide">
    <hairit-icon name="close" />
  </button>

  <ng-container *ngIf="!sent(); else confirmation">
    <header class="modal__head">
      <p class="modal__eyebrow">Cere o programare</p>
      <h2 class="modal__title">Spune-ne ce ți-ai dori.</h2>
    </header>

    <form class="modal__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field__label">Nume</span>
        <input type="text" formControlName="name" placeholder="Numele tău" autocomplete="name" />
        <span class="field__error" *ngIf="invalid('name')">Numele trebuie să aibă minim 3 caractere.</span>
      </label>

      <label class="field">
        <span class="field__label">Telefon</span>
        <input type="tel" formControlName="phone" placeholder="+40 7xx xxx xxx" autocomplete="tel" />
        <span class="field__error" *ngIf="invalid('phone')">Introdu un număr de telefon valid.</span>
      </label>

      <label class="field">
        <span class="field__label">Serviciu dorit</span>
        <select formControlName="service">
          <option value="">Alege un serviciu</option>
          <option *ngFor="let service of store.services()" [value]="service.name">{{ service.name }}</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Mesaj (opțional)</span>
        <textarea rows="3" formControlName="message" placeholder="Zile preferate, ore, detalii despre păr."></textarea>
        <span class="field__error" *ngIf="invalid('message')">Maxim 300 de caractere.</span>
      </label>

      <div class="modal__actions">
        <p class="modal__note">Răspundem în aceeași zi lucrătoare.</p>
        <button type="submit" class="pill pill--dark pill--arrow pill--up" [disabled]="sending()">
          {{ sending() ? 'Se trimite…' : 'Trimite cererea' }}
          <span class="pill__badge"><hairit-icon name="arrow-up-right" /></span>
        </button>
      </div>
    </form>
  </ng-container>

  <ng-template #confirmation>
    <div class="modal__success">
      <span class="modal__mark"><hairit-icon name="check" /></span>
      <h2 class="modal__title">Cerere primită</h2>
      <p class="modal__note">
        Mulțumim! Te sunăm în aceeași zi lucrătoare pentru a confirma intervalul potrivit.
      </p>
      <button type="button" class="pill pill--dark" (click)="close()">Închide</button>
    </div>
  </ng-template>
</div>
